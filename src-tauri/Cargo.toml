[package]
name = "lgd-ftp-data-sync"
version = "1.0.1"
description = "Watch a file or folder and auto-upload changes over FTP / FTPS / SFTP"
authors = ["LGD <lgd@augmont.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.7.2"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
suppaftp = { version = "10.0.2", features = ["native-tls", "deprecated"] }
russh = "0.63.1"
russh-sftp = "2.4.0"
tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

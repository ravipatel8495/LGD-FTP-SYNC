name: Release installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (leave empty for next patch, e.g. 1.0.2)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick next version (keep all previous GitHub releases)
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin || true
          BASE="$(node -p "require('./package.json').version")"
          bump() {
            node -e "const p=process.argv[1].split('.').map(Number); p[2]+=1; console.log(p.join('.'))" "$1"
          }
          exists() {
            git rev-parse "refs/tags/v$1" >/dev/null 2>&1 \
              || git ls-remote --tags origin "refs/tags/v$1" | grep -q . \
              || gh release view "v$1" >/dev/null 2>&1
          }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$BASE"
            while exists "$VERSION"; do
              VERSION="$(bump "$VERSION")"
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing as v$VERSION (older GitHub releases are kept)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app --config signing.macos.json
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi --config signing.windows.json

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set this release version
        run: node scripts/set-app-version.js "${{ needs.version.outputs.version }}"

      - name: Install Linux WebKitGTK
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnupg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Intel + Apple Silicon targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Import Windows self-signed certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            '{}' | Set-Content signing.windows.json
            Write-Host "No WINDOWS_CERTIFICATE secret — Windows build will be unsigned"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$pwd/certificate/certificate.pfx", $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          $thumb = $cert.Thumbprint
          Write-Host "Imported cert thumbprint $thumb"
          $extra = @{ bundle = @{ windows = @{ certificateThumbprint = $thumb; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 6
          Set-Content -Path signing.windows.json -Value $extra

      # Self-signed "Augmont Goldtech" is NOT a valid Apple codesign identity on
      # GitHub's Mac runners (security find-identity will not resolve it).
      # Use ad-hoc "-" unless a real Apple Developer ID is configured.
      - name: macOS signing config
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${IDENT:-}" ]; then
            python3 -c "import json,os; json.dump({'bundle':{'macOS':{'signingIdentity':os.environ['IDENT']}}}, open('signing.macos.json','w'))"
            echo "Apple Developer identity: $IDENT"
          else
            printf '%s\n' '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > signing.macos.json
            echo "Ad-hoc Mac signing (no Apple Developer ID). Gatekeeper still needs Open Anyway."
          fi

      - name: Install frontend deps
        run: npm ci

      - name: Build installers (Windows / Linux)
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tauriScript: npm run tauri
          includeRelease: true
          includeDebug: false
          includeUpdaterJson: false

      # Do not pass APPLE_CERTIFICATE (even as empty). Tauri treats the env var as
      # "import this p12" and `security import` fails with SecKeychainItemImport.
      - name: Build installers (macOS, ad-hoc)
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || true
          test -f signing.macos.json
          npx tauri build ${{ matrix.args }}

      - name: Pack CA into macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          find src-tauri/target -path '*/bundle/*' -name '*.dmg' -type f | while IFS= read -r dmg; do
            bash scripts/embed-ca-in-dmg.sh "$dmg" signing/Install-this-CA-on-PCs.crt
          done

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-out
          find src-tauri/target -path '*/bundle/*' -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' \
          \) -exec cp -f {} dist-out/ \;
          ls -lh dist-out || true
          count="$(find dist-out -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "No installers were produced. Dumping bundle dirs:"
            find src-tauri/target -type d -name bundle -print -o -name '*.exe' -print -o -name '*.dmg' -print | head -80
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lgd-ftp-data-sync-${{ matrix.platform }}
          path: dist-out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gather installers and SHA-256 checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          mkdir -p "out/${TAG}"
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
            -o -name '*.deb' -o -name '*.AppImage' \
          \) -exec cp -f {} "out/${TAG}/" \;
          cp -f signing/Install-this-CA-on-PCs.crt "out/${TAG}/"
          cd "out/${TAG}"
          count="$(find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "Publish aborted: no OS installers in artifacts (only extras like .crt)."
            find ../../artifacts -type f | head -50
            exit 1
          fi
          shasum -a 256 * > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Attest installers (free GitHub provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/v${{ needs.version.outputs.version }}/*'

      - name: Create versioned GitHub Release (keep older versions)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="$(cat <<EOF
          ## LGD FTP DATA SYNC ${VERSION}

          Versioned installers. Previous GitHub releases are kept.

          | OS | File |
          |----|------|
          | Windows | \`LGD FTP DATA SYNC_${VERSION}_x64-setup.exe\` |
          | macOS | \`LGD FTP DATA SYNC_${VERSION}_*.dmg\` |
          | Ubuntu | \`LGD FTP DATA SYNC_${VERSION}_*.deb\` / AppImage |

          Windows \`.exe\` and macOS \`.dmg\` are GitHub Actions builds. The Augmont CA is packed inside both (the Windows setup installs it automatically).

          Verify from GitHub:
          \`\`\`
          gh attestation verify <downloaded-file> --repo ${GITHUB_REPOSITORY}
          \`\`\`
          Checksums: \`SHA256SUMS.txt\` on this page.
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/${TAG}"/* --clobber
            gh release edit "$TAG" --latest --title "LGD FTP DATA SYNC ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "out/${TAG}"/* --latest --title "LGD FTP DATA SYNC ${VERSION}" --notes "$NOTES"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "All versions: https://github.com/${GITHUB_REPOSITORY}/releases"

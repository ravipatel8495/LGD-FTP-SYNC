<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Augmont ring mark: gold outer ring and silver inner ring,
       each broken at top and bottom like the brand favicon -->
  <g fill="none" stroke-linecap="round">
    <circle cx="50" cy="50" r="42" stroke="#d9a02b" stroke-width="10"
      stroke-dasharray="118.75 13.19" transform="rotate(-81 50 50)"/>
    <circle cx="50" cy="50" r="30" stroke="#b9bcc2" stroke-width="6"
      stroke-dasharray="84.82 9.42" transform="rotate(-81 50 50)"/>
  </g>
</svg>
